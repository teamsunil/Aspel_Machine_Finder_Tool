<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machine Finder | Aspel Cleaning Equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#373435; --sky:#00AFF0; --deep:#0077BE;
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#373435; --muted:#5E6468;
  --line:#D5DCE1; --select:#E3F4FC; --focus:#0077BE; --ok:#1B7F4B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E2124; --surface:#2A2E32; --ink:#ECEFF1; --muted:#A9B1B7;
    --line:#40464C; --select:#123447; --focus:#4CC6F5; --ok:#5FD39A;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2124; --surface:#2A2E32; --ink:#ECEFF1; --muted:#A9B1B7;
  --line:#40464C; --select:#123447; --focus:#4CC6F5; --ok:#5FD39A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 17px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-weight:700;line-height:1.1;margin:0}
button,input{font:inherit;color:inherit}
 a{color:var(--deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:#4CC6F5}}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Header with the logo's waves as the signature element */
.masthead{background:#fff;position:relative}
.masthead-inner{max-width:1080px;margin:0 auto;padding:18px 24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.masthead img{height:54px;width:auto;max-width:70vw;display:block}
header.masthead a.phone{color:var(--charcoal);text-decoration:none;font-weight:600;white-space:nowrap}
.phone span{color:#5E6468;font-weight:400}
.waves{display:block;width:100%;height:26px;margin-top:-20px}
.demo-flag{max-width:1080px;margin:0 auto;padding:10px 24px 0;color:var(--muted);font-size:14px}

main{max-width:1080px;margin:0 auto;padding:20px 24px 64px}

/* Intro */
.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;padding:36px 0 12px}
.intro h1{font-size:clamp(38px,6vw,64px);color:var(--ink);letter-spacing:-.01em}
.intro p{font-size:19px;color:var(--muted);max-width:34em;margin:18px 0 28px}
.facts{list-style:none;padding:0;margin:0;border-left:4px solid var(--sky)}
.facts li{padding:10px 0 10px 20px;color:var(--muted)}
.facts strong{display:block;color:var(--ink);font-family:"Barlow Semi Condensed",sans-serif;font-size:22px}

.btn{border:0;border-radius:6px;padding:14px 26px;font-weight:600;cursor:pointer;background:var(--deep);color:#fff;font-size:17px}
.btn:hover{background:#00659f}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface)}
.linkish{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px}

/* Question */
.progress{margin:18px 0 28px}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:15px;margin-bottom:8px}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.fill{height:100%;width:0;border-radius:5px;transition:width .35s ease;
  background:repeating-linear-gradient(115deg,var(--sky) 0 14px,var(--deep) 14px 28px)}
.q h2{font-size:clamp(30px,4.4vw,44px);max-width:20em}
.q .hint{color:var(--muted);margin:10px 0 26px}
.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:18px 18px 16px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;min-height:92px}
.opt:hover{border-color:var(--sky)}
.opt[aria-pressed="true"]{border-color:var(--deep);background:var(--select)}
.opt svg{flex:0 0 32px;height:32px;color:var(--deep)}
.opt b{display:block;font-weight:600;font-size:18px}
.opt small{display:block;color:var(--muted);font-size:15px;line-height:1.4;margin-top:2px}
.qnav{display:flex;justify-content:space-between;margin-top:28px}

/* Results */
.results-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end;margin:28px 0 8px}
.results-head h2{font-size:clamp(32px,4.6vw,48px)}
.summary{color:var(--muted);margin:8px 0 0;max-width:48em}
.recs{display:grid;gap:16px;margin-top:24px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;grid-template-columns:88px 1fr auto;gap:20px;align-items:start}
.rec.top{border:2px solid var(--deep)}
.rec .pic{width:88px;height:88px;border-radius:8px;background:var(--select);display:grid;place-items:center;color:var(--deep)}
.rec .pic svg{width:52px;height:52px}
.rec .brand{color:var(--muted);font-size:15px}
.rec h3{font-size:26px;margin:2px 0 6px}
.rec .why{margin:10px 0 0;padding:0;list-style:none}
.rec .why li{padding-left:22px;position:relative;margin:4px 0;font-size:16px}
.rec .why li::before{content:"";position:absolute;left:4px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--sky)}
.match{text-align:right;min-width:92px}
.match b{font-family:"Barlow Semi Condensed",sans-serif;font-size:34px;color:var(--deep);display:block;line-height:1}
.match span{color:var(--muted);font-size:14px}
.badge{display:inline-block;background:var(--deep);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:8px}

.advice{margin-top:28px;background:var(--surface);border-left:6px solid var(--sky);border-radius:0 10px 10px 0;padding:22px 24px}
.advice h3{font-size:26px;margin-bottom:6px}
.advice p{margin:0;color:var(--muted);max-width:52em}

.lead{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:32px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px}
.lead h3{font-size:28px}
.lead p{color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choices label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.choices input{accent-color:var(--deep);width:18px;height:18px}
form .field{margin-bottom:14px}
form label.l{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
form input[type=text],form input[type=email],form input[type=tel]{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.err{color:#C2261C;font-size:14px;min-height:1.2em;margin-top:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF8A80}}

/* Confirmation + sales view */
.done{margin-top:28px;display:grid;grid-template-columns:1fr 1.1fr;gap:28px}
.done .thanks h2{font-size:clamp(32px,4.6vw,46px)}
.done .thanks p{color:var(--muted)}
.ticket{background:var(--surface);border:1px dashed var(--deep);border-radius:10px;padding:22px}
.ticket h3{font-size:22px;margin-bottom:4px}
.ticket .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.ticket dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:15px}
.ticket dt{color:var(--muted)}
.ticket dd{margin:0;font-weight:500}
.tick{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;margin-bottom:12px}

.screen{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.fill{transition:none}}

footer{max-width:1080px;margin:0 auto;padding:0 24px 32px;color:var(--muted);font-size:14px}

@media (max-width:820px){
  .intro,.lead,.done{grid-template-columns:1fr;gap:28px}
  .rec{grid-template-columns:64px 1fr}
  .rec .pic{width:64px;height:64px}.rec .pic svg{width:38px;height:38px}
  .match{grid-column:2;text-align:left;display:flex;gap:8px;align-items:baseline}
  .match b{font-size:26px}
  .masthead img{height:34px}
  .phone span{display:none}
}
</style>
</head>

  sweeper:'<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M34 6l6 18"/><rect x="10" y="24" width="30" height="12" rx="2"/><path d="M8 42l6-6M18 44l2-8M30 44l-2-8M42 42l-6-6"/></svg>',
  washer:'<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="8" y="18" width="20" height="22" rx="3"/><path d="M28 26c8 0 6 10 14 10M42 36l6-3M42 36l6 3"/><circle cx="12" cy="43" r="3"/><circle cx="24" cy="43" r="3"/></svg>',
  foam:'<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="10" y="12" width="18" height="30" rx="3"/><path d="M28 20h8l4 4"/><circle cx="44" cy="20" r="3"/><circle cx="46" cy="30" r="2"/><circle cx="40" cy="28" r="2"/></svg>',

  vac:'<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="22" y="18" width="20" height="22" rx="5"/><path d="M22 28H12V10M6 44h14"/><circle cx="26" cy="43" r="2"/><circle cx="38" cy="43" r="2"/></svg>'
};

/* ---------- Questions ---------- */
const QUESTIONS = [
  {id:'industry', title:'What kind of business are you cleaning for?', hint:'We use this to lean towards machines that work well in your sector.',
   opts:[
    {v:'automotive',l:'Automotive',s:'Dealerships, workshops, service centres',i:'vehicle'},
    {v:'contract',l:'Contract cleaning',s:'Offices, retail, shared sites',i:'vacuum'},
    {v:'council',l:'Council',s:'Streets, malls, parks, public facilities',i:'outdoor'},
    {v:'construction',l:'Earthmoving & construction',s:'Plant, sites, yards',i:'mud'},
    {v:'food',l:'Food',s:'Processing, packing, commercial kitchens',i:'food'},
    {v:'manufacturing',l:'Manufacturing & distribution',s:'Factories, warehouses, DCs',i:'ind'},
    {v:'transport',l:'Truck & transport',s:'Fleets, depots, wash bays',i:'vehicle'}
   ]},
  {id:'task', title:'What do you mainly need to clean?', hint:'Pick the job that matters most. Our team can cover the rest on the call.',
   opts:[
    {v:'floor',l:'Hard floors indoors',s:'Warehouse, workshop, factory or shop floors',i:'floor'},
    {v:'outdoor',l:'Outdoor hard surfaces',s:'Car parks, footpaths, yards, loading docks',i:'outdoor'},
    {v:'vehicle',l:'Vehicles & machinery',s:'Trucks, plant, equipment, engine bays',i:'vehicle'},
    {v:'food',l:'Food production areas',s:'Walls, floors and equipment to hygiene standard',i:'hygiene'},
    {v:'vacuum',l:'Carpets, offices & fine dust',s:'Vacuuming indoors, wet or dry',i:'vacuum'}
   ]},
  {id:'dirt', title:'What are you usually cleaning up?', hint:'This decides between sweeping, scrubbing, hot water or cold.',
   opts:[
    {v:'dust',l:'Dust, litter & loose debris',s:'Dry mess that needs picking up',i:'dust'},
    {v:'grease',l:'Oil, grease & grime',s:'Stuck-on marks, tyre marks, oily residue',i:'grease'},
    {v:'mud',l:'Mud & heavy build-up',s:'Caked dirt, clay, concrete dust',i:'mud'},
    {v:'food',l:'Food residue & bacteria',s:'Fats, proteins, sanitation',i:'hygiene'}
   ]},
  {id:'size', title:'Roughly how big is the area?', hint:'A best guess is fine. Bigger areas justify ride-on machines.', when:a=>['floor','outdoor','food'].includes(a.task),
   opts:[
    {v:'s',l:'Under 500 m²',s:'A workshop, shop or small kitchen',i:'size'},
    {v:'m',l:'500 to 2,000 m²',s:'A medium warehouse or car park',i:'size'},
    {v:'l',l:'2,000 to 10,000 m²',s:'A large factory or distribution centre',i:'size'},
    {v:'xl',l:'Over 10,000 m²',s:'Multiple buildings, large sites, streets',i:'size'}
   ]},
  {id:'env', title:'Where will the machine be used?', hint:'Power supply decides between electric, battery and petrol models.',
   opts:[
    {v:'in',l:'Indoors, power available',s:'Standard or 3-phase outlets on site',i:'plug'},
    {v:'outp',l:'Outdoors, power available',s:'Wash bay or yard with outlets',i:'sun'},
    {v:'outnp',l:'Outdoors, no power',s:'Remote sites, streets, on the move',i:'fuel'}
   ]},
  {id:'freq', title:'How often will you use it?', hint:'Frequency tells us whether buying, renting or hiring makes more sense.',
   opts:[
    {v:'daily',l:'Every day',s:'Part of the daily routine',i:'cal'},
    {v:'weekly',l:'A few times a week',s:'Regular but not constant',i:'cycle'},
    {v:'occasional',l:'Occasionally or one-off',s:'Shutdowns, projects, seasonal jobs',i:'clock'}
   ]},
  {id:'acq', title:'How would you prefer to get it?', hint:'Not sure is a fine answer. We will suggest the best fit.',
   opts:[
    {v:'buy',l:'Buy',s:'Own it, serviced by our technicians',i:'cart'},
    {v:'rent',l:'Long-term rental',s:'Fixed monthly fee, new machine, fully maintained',i:'cycle'},
    {v:'hire',l:'Short-term hire',s:'Delivered for days or weeks',i:'clock'},
    {v:'unsure',l:'Not sure yet',s:'Recommend what suits my usage',i:'help'}
   ]}
];

/* ---------- Sample catalogue (for Aspel to validate) ---------- */
const M = [
  {n:'SC401 compact scrubber dryer',b:'Nilfisk',pic:'scrubber',tasks:['floor','food'],dirt:['grease','food','dust'],size:['s'],env:['in'],ind:['automotive','food','contract'],power:'Battery powered, quiet enough for trading hours',kind:'walk-behind scrubber'},
  {n:'AS5160 walk-behind scrubber',b:'Viper',pic:'scrubber',tasks:['floor','food'],dirt:['grease','food','mud'],size:['s','m'],env:['in'],ind:['contract','food','manufacturing'],power:'Battery powered with onboard charger',kind:'walk-behind scrubber'},
  {n:'B 150 R ride-on scrubber',b:'Kärcher',pic:'rideon',tasks:['floor'],dirt:['grease','mud','dust'],size:['m','l'],env:['in','outnp'],ind:['manufacturing','contract','transport'],power:'Battery powered, runs without a power point',kind:'ride-on scrubber'},
  {n:'SC6500 ride-on scrubber dryer',b:'Nilfisk',pic:'rideon',tasks:['floor'],dirt:['grease','mud','food'],size:['l','xl'],env:['in','outnp'],ind:['manufacturing','food'],power:'Battery powered for long shifts',kind:'ride-on scrubber'},
  {n:'KM 70/20 C push sweeper',b:'Kärcher',pic:'sweeper',tasks:['floor','outdoor'],dirt:['dust'],size:['s'],env:['in','outp','outnp'],ind:['council','contract','automotive'],power:'Manual, no power or fuel needed',kind:'push sweeper'},
  {n:'SW900 ride-on sweeper',b:'Nilfisk',pic:'rideon',tasks:['floor','outdoor'],dirt:['dust','mud'],size:['m','l'],env:['in','outp','outnp'],ind:['manufacturing','transport','council'],power:'Battery or LPG options',kind:'ride-on sweeper'},
  {n:'KM 100/100 R ride-on sweeper',b:'Kärcher',pic:'rideon',tasks:['outdoor','floor'],dirt:['dust','mud'],size:['l','xl'],env:['outp','outnp','in'],ind:['council','construction','manufacturing'],power:'Petrol, LPG or battery variants',kind:'ride-on sweeper'},
  {n:'HDS 8/18 hot water pressure cleaner',b:'Kärcher',pic:'washer',tasks:['vehicle','outdoor','food'],dirt:['grease','mud','food'],size:['s','m','l','xl'],env:['in','outp'],ind:['automotive','transport','food','construction'],power:'415V electric with diesel-fired heating',kind:'hot water pressure cleaner'},
  {n:'quadro 1200 TST pressure cleaner',b:'Kränzle',pic:'washer',tasks:['vehicle','outdoor'],dirt:['mud','dust'],size:['s','m','l','xl'],env:['outp','in'],ind:['construction','transport','council'],power:'415V electric, cold water',kind:'cold water pressure cleaner'},
  {n:'Petrol hot water pressure cleaner',b:'Jetwave',pic:'washer',tasks:['vehicle','outdoor'],dirt:['grease','mud'],size:['s','m','l','xl'],env:['outnp'],ind:['construction','transport','council'],power:'Petrol engine, fully self-contained',kind:'mobile pressure cleaner'},
  {n:'Mobile foam and rinse unit',b:'Nilfisk Food',pic:'foam',tasks:['food'],dirt:['food','grease'],size:['s','m','l','xl'],env:['in'],ind:['food'],power:'Runs off mains water and air',kind:'foam sanitation unit'},
  {n:'2411 street litter vacuum',b:'Glutton',pic:'litter',tasks:['outdoor'],dirt:['dust'],size:['m','l','xl'],env:['outnp','outp'],ind:['council','contract'],power:'Battery electric, quiet and zero emission',kind:'litter vacuum'},
  {n:'VP300 dry vacuum',b:'Nilfisk',pic:'vac',tasks:['vacuum'],dirt:['dust'],size:['s','m'],env:['in'],ind:['contract','automotive'],power:'240V, lightweight for daily rounds',kind:'dry vacuum'},
  {n:'Attix 30 wet & dry vacuum',b:'Nilfisk',pic:'vac',tasks:['vacuum','floor'],dirt:['dust','food','mud'],size:['s','m'],env:['in','outp'],ind:['contract','construction','food','automotive'],power:'240V with auto filter cleaning',kind:'wet and dry vacuum'}
];

const LABEL = {};
QUESTIONS.forEach(q=>{LABEL[q.id]={};q.opts.forEach(o=>LABEL[q.id][o.v]=o.l)});
const SIZE_ORDER=['s','m','l','xl'];

/* ---------- State ---------- */
let answers = {}, step = 0, lastRecs = [], lastAcq = null;
const app = document.getElementById('app');
const activeQs = () => QUESTIONS.filter(q => !q.when || q.when(answers));

function go(screen){
  if(screen==='intro'){answers={};step=0;renderIntro();}
  window.scrollTo({top:0,behavior:'auto'});
}

/* ---------- Screens ---------- */
function renderIntro(){
  app.innerHTML = `
  <section class="screen intro">
    <div>
      <h1>Find the right cleaning machine in about a minute</h1>
      <p>Answer a few quick questions about your site and we will recommend machines from the brands we stock. It is the same advice our team gives on a site visit, available any time.</p>
      <button class="btn" onclick="start()">Start the Machine Finder</button>
    </div>
    <ul class="facts">
      <li><strong>Eight brands, no bias</strong>We recommend what suits your site, not one manufacturer's catalogue.</li>
      <li><strong>Buy, rent or hire</strong>We match how you get the machine to how often you use it.</li>
      <li><strong>Serviced by our own technicians</strong>Nine service vans across Sydney, the ACT and regional NSW.</li>
    </ul>
  </section>`;
}
function start(){answers={};step=0;renderQ();}

function renderQ(){
  const qs = activeQs(), q = qs[step];
  const pct = Math.round((step)/qs.length*100);
  app.innerHTML = `
  <section class="screen q">
    <div class="progress">
      <div class="progress-row"><span>Question ${step+1} of ${qs.length}</span><span>${pct}% done</span></div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="fill" id="fill"></div></div>
    </div>
    <h2 id="qt" tabindex="-1">${q.title}</h2>
    <p class="hint">${q.hint}</p>
    <div class="options" role="group" aria-labelledby="qt">
      ${q.opts.map(o=>`<button class="opt" aria-pressed="${answers[q.id]===o.v}" onclick="pick('${q.id}','${o.v}',this)">${I[o.i]}<span><b>${o.l}</b><small>${o.s}</small></span></button>`).join('')}
    </div>
    <div class="qnav">
      <button class="btn ghost" onclick="back()">Back</button>
      ${answers[q.id]?`<button class="btn" onclick="next()">Next</button>`:''}
    </div>
  </section>`;
  requestAnimationFrame(()=>{document.getElementById('fill').style.width=pct+'%';document.getElementById('qt').focus({preventScroll:true});});
}
function pick(id,v,el){
  answers[id]=v;
  document.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed','false'));
  el.setAttribute('aria-pressed','true');
  setTimeout(next,220);
}
function next(){
  const qs = activeQs();
  if(step < qs.length-1){step++;renderQ();window.scrollTo({top:0});}
  else renderResults();
}
function back(){ if(step===0){go('intro');} else {step--;renderQ();} }

/* ---------- Matching ---------- */
function score(m,a){
  let s=0, why=[];
  if(!m.tasks.includes(a.task)) return null;
  s += m.tasks[0]===a.task ? 40 : 30;
  why.push(`Built for ${LABEL.task[a.task].toLowerCase()}`);
  if(m.dirt.includes(a.dirt)){s+=20;why.push(`Handles ${LABEL.dirt[a.dirt].toLowerCase()}`);} else s-=5;
  const size = a.size || 'm';
  if(m.size.includes(size)){s+=15; if(a.size) why.push(`Right scale for ${LABEL.size[a.size].replace('Under','under').replace('Over','over')}`);}
  else{
    const d = Math.min(...m.size.map(x=>Math.abs(SIZE_ORDER.indexOf(x)-SIZE_ORDER.indexOf(size))));
    s += d===1 ? 5 : -15;
  }
  if(m.env.includes(a.env)){s+=15;why.push(m.power);} else s-=30;
  if(m.ind.includes(a.industry)){s+=8;why.push(`Popular with ${LABEL.industry[a.industry].toLowerCase()} customers`);}
  return {m, s:Math.max(0,Math.min(98,s)), why:why.slice(0,4)};
}
function acquisition(a){
  const byFreq = a.freq==='occasional' ? 'hire' : a.freq==='daily' ? 'rent' : 'buy';
  const pick = a.acq==='unsure' ? byFreq : a.acq;
  const txt = {
    hire:{t:'Short-term hire suits you best', p:'For occasional jobs, shutdowns or one-off projects, we deliver the machine when you need it and collect it after. No servicing or storage to worry about.'},
    rent:{t:'Long-term rental suits you best', p:'For regular use, a fixed monthly fee gets you a new machine, fully maintained by our technicians. Terms are typically three years, then renew with a new machine.'},
    buy:{t:'Buying suits you best', p:'For steady use, owning the machine is usually the best value over its life. All warranty work is done by our own technicians, on site or at our Penrith workshop.'}
  }[pick];
  let note = '';
  if(a.acq!=='unsure' && a.acq!==byFreq){
    const alt = {hire:'short-term hire',rent:'long-term rental',buy:'buying'}[byFreq];
    note = ` Based on how often you will use it, ${alt} may also be worth comparing. We can price both.`;
  }
  return {key:pick, t:txt.t, p:txt.p+note};
}

function renderResults(){
  const a = answers;
  lastRecs = M.map(m=>score(m,a)).filter(Boolean).sort((x,y)=>y.s-x.s).slice(0,3);
  lastAcq = acquisition(a);
  const sum = [LABEL.industry[a.industry], LABEL.task[a.task], LABEL.dirt[a.dirt], a.size?LABEL.size[a.size]:null, LABEL.env[a.env], LABEL.freq[a.freq]].filter(Boolean).join(', ');
  const hasRecs = lastRecs.length>0;
  app.innerHTML = `
  <section class="screen">
    <div class="results-head">
      <div>
        <h2 id="rt" tabindex="-1">${hasRecs?'Your recommended machines':'Let us look at this one together'}</h2>
        <p class="summary">Based on: ${sum}.</p>
      </div>
      <button class="linkish" onclick="start()">Change my answers</button>
    </div>
    ${hasRecs ? `<div class="recs">${lastRecs.map((r,i)=>`
      <article class="rec ${i===0?'top':''}">
        <div class="pic">${I[r.m.pic]}</div>
        <div>
          ${i===0?'<span class="badge">Best match</span>':''}
          <div class="brand">${r.m.b}</div>
          <h3>${r.m.n}</h3>
          <ul class="why">${r.why.map(w=>`<li>${w}</li>`).join('')}</ul>
        </div>
        <div class="match"><b>${r.s}%</b><span>match</span></div>
      </article>`).join('')}</div>`
    : `<p class="summary">That combination is unusual, which usually means a custom setup. Leave your details and our team will call with options.</p>`}
    <div class="advice">
      <h3>${lastAcq.t}</h3>
      <p>${lastAcq.p}</p>
    </div>
    <div class="lead">
      <div>
        <h3>Get pricing and a second opinion</h3>
        <p>Our team will confirm the right model for your site and send prices for ${lastAcq.key==='hire'?'hire':lastAcq.key==='rent'?'rental':'purchase'}.</p>
        <div class="choices" role="radiogroup" aria-label="What would you like next">
          <label><input type="radio" name="next" value="Quote" checked> Send me a quote</label>
          <label><input type="radio" name="next" value="On-site assessment"> Book a free on-site assessment</label>
          <label><input type="radio" name="next" value="Demo"> Arrange a machine demo</label>
        </div>
      </div>
      <form id="lf" novalidate>
        <div class="field"><label class="l" for="fn">Your name</label><input type="text" id="fn" autocomplete="name"><div class="err" id="e-fn"></div></div>
        <div class="field"><label class="l" for="fc">Company</label><input type="text" id="fc" autocomplete="organization"><div class="err" id="e-fc"></div></div>
        <div class="field"><label class="l" for="fe">Email</label><input type="email" id="fe" autocomplete="email"><div class="err" id="e-fe"></div></div>
        <div class="field"><label class="l" for="fp">Phone</label><input type="tel" id="fp" autocomplete="tel"><div class="err" id="e-fp"></div></div>
        <div class="field"><label class="l" for="fs">Site suburb</label><input type="text" id="fs" placeholder="e.g. Penrith"></div>
        <button class="btn" type="submit">Send my enquiry</button>
      </form>
    </div>
  </section>`;
  document.getElementById('rt').focus({preventScroll:true});
  document.getElementById('lf').addEventListener('submit',submitLead);
}

function submitLead(e){
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const errs = {
    fn: v('fn')?'':'Enter your name.',
    fc: v('fc')?'':'Enter your company name.',
    fe: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('fe'))?'':'Enter a valid email, like name@company.com.au.',
    fp: v('fp').replace(/\D/g,'').length>=8?'':'Enter a phone number with at least 8 digits.'
  };
  let first=null;
  Object.entries(errs).forEach(([k,m])=>{document.getElementById('e-'+k).textContent=m; if(m&&!first) first=k;});
  if(first){document.getElementById(first).focus();return;}
  const nextStep = document.querySelector('input[name=next]:checked').value;
  renderDone({name:v('fn'),company:v('fc'),email:v('fe'),phone:v('fp'),suburb:v('fs')||'Not given',nextStep});
}

function renderDone(l){
  const a = answers;
  const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const first = esc(l.name.split(' ')[0]);
  app.innerHTML = `
  <section class="screen done">
    <div class="thanks">
      <div class="tick" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
      <h2 id="dt" tabindex="-1">Enquiry sent. Thanks, ${first}.</h2>
      <p>Our team will be in touch shortly about your ${esc(l.nextStep.toLowerCase())}. If it is urgent, call us on <a href="tel:1300311999">1300 311 999</a>, Monday to Friday from 7:30am.</p>
      <button class="btn ghost" onclick="go('intro')">Start again</button>
    </div>
    <div class="ticket">
      <h3>What Aspel's sales team receives</h3>
      <p class="sub">Demo view. In the live build this goes to sales@aspel.com.au and the CRM.</p>
      <dl>
        <dt>Contact</dt><dd>${esc(l.name)}, ${esc(l.company)}</dd>
        <dt>Email</dt><dd>${esc(l.email)}</dd>
        <dt>Phone</dt><dd>${esc(l.phone)}</dd>
        <dt>Site</dt><dd>${esc(l.suburb)}</dd>
        <dt>Requested</dt><dd>${esc(l.nextStep)}</dd>
        <dt>Industry</dt><dd>${LABEL.industry[a.industry]}</dd>
        <dt>Job</dt><dd>${LABEL.task[a.task]}, ${LABEL.dirt[a.dirt].toLowerCase()}</dd>
        ${a.size?`<dt>Area</dt><dd>${LABEL.size[a.size]}</dd>`:''}
        <dt>Location</dt><dd>${LABEL.env[a.env]}</dd>
        <dt>Usage</dt><dd>${LABEL.freq[a.freq]}</dd>
        <dt>Preference</dt><dd>${LABEL.acq[a.acq]} (suggested: ${lastAcq.key==='hire'?'short-term hire':lastAcq.key==='rent'?'long-term rental':'buy'})</dd>
        <dt>Top picks</dt><dd>${lastRecs.length?lastRecs.map(r=>`${r.m.b} ${r.m.n} (${r.s}%)`).join('<br>'):'None, custom setup'}</dd>
      </dl>
    </div>
  </section>`;
  document.getElementById('dt').focus({preventScroll:true});
  window.scrollTo({top:0});
}

renderIntro();
</script>
